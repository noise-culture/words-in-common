<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORDS IN COMMON</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101014;color:#eae8e2;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#stage{position:fixed;inset:0;overflow:hidden}.word{position:absolute;white-space:nowrap;pointer-events:none;font-family:Georgia,'Yu Mincho',serif;will-change:transform;transform-origin:center}#ui{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(94vw,580px);background:#202026e8;border:1px solid #45454b;border-radius:18px;padding:14px;backdrop-filter:blur(12px)}form{display:flex;gap:8px}input{flex:1;min-width:0;padding:13px;background:#111116;color:white;border:1px solid #56565d;border-radius:10px;font-size:16px}button{padding:12px 17px;border:0;border-radius:10px;background:#eae8e2;color:#151519;font-weight:600;cursor:pointer}button:disabled{opacity:.5}#status{font-size:12px;color:#b6b4b0;margin:0 0 10px}#info{font-size:11px;color:#b6b4b0;margin:9px 0 0}#title{position:fixed;top:22px;left:24px;letter-spacing:.2em;font-size:11px;color:#a9a6a3}#notice{position:fixed;top:22px;right:20px;font-size:12px;color:#b6b4b0}#setup{position:fixed;inset:0;z-index:10;background:#101014;display:flex;align-items:center;justify-content:center;padding:24px}#setup article{max-width:540px;line-height:1.8}code{font-size:12px;word-break:break-all;color:#d8d3bd}a{color:#d8d3bd}#setup h1{font-size:24px;font-weight:400}#setup p{color:#c3c0b9}#setup textarea{width:100%;height:180px;background:#202026;color:#fff;border:1px solid #666;border-radius:8px;padding:12px;font:12px monospace}#setup button{margin-top:10px}#setup small{display:block;color:#aaa;margin-top:8px}#ui{z-index:7}#title,#notice{z-index:5}
/* Standard mobile form; no pan/zoom or full-screen repositioning. */
body.participant #stage,body.participant #title,body.participant #notice{display:none!important}
body.participant{overflow:hidden;background:#101014}
body.participant #ui{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));top:auto;right:auto;transform:translateX(-50%);width:min(94vw,580px);height:auto;max-width:none;display:block;padding:14px;background:#202026e8;border:1px solid #45454b;border-radius:18px;backdrop-filter:blur(12px);z-index:7}
body.participant #ui[hidden]{display:none}
body.participant #form{position:static;display:flex;flex-direction:row;gap:8px}
body.participant #input{flex:1;min-width:0;width:auto;min-height:0;padding:13px;font-family:system-ui,-apple-system,sans-serif;font-size:16px;text-align:left;background:#111116;border:1px solid #56565d;border-radius:10px;color:#fff;box-shadow:none}
body.participant #send{width:auto;min-height:0;border-radius:10px;letter-spacing:normal;font-size:14px}
body.participant #status{position:static;width:auto;text-align:left;letter-spacing:normal}
body.participant #info{position:static;width:auto;text-align:left;letter-spacing:normal}
@media(max-width:380px){body.participant #ui{bottom:calc(12px + env(safe-area-inset-bottom))}}
#flightLayer{display:none;position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden;perspective:650px}
body.participant #flightLayer{display:block}
.flightWord{position:absolute;left:50%;top:49%;white-space:nowrap;font-family:Georgia,'Yu Mincho',serif;color:#f1eee7;font-size:clamp(27px,9vw,52px);max-width:95vw;text-overflow:ellipsis;overflow:hidden;transform:translate(-50%,-50%) scale(.75);opacity:0;filter:blur(0);animation:wordRelease 1450ms cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wordRelease{0%{opacity:0;transform:translate(-50%,30%) scale(.75);filter:blur(0)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}45%{opacity:1;transform:translate(-50%,-90%) scale(1)}100%{opacity:0;transform:translate(-50%,-360%) scale(.04);filter:blur(3px)}}
#released{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:11;pointer-events:none;letter-spacing:.32em;font-size:13px;color:#d9d6d0;animation:releaseFade 1s ease both}
@keyframes releaseFade{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
body.participant #released.visible{display:flex}
@media(prefers-reduced-motion:reduce){.flightWord{animation-duration:500ms}}
</style></head><body><div id="stage"></div><div id="flightLayer" aria-hidden="true"></div><div id="released" aria-hidden="true">RELEASED</div><div id="title">WORDS IN COMMON</div><div id="notice"></div><section id="ui" hidden><div id="status">接続中…</div><form id="form"><input id="input" maxlength="36" placeholder="言葉を入力する" aria-label="投稿する言葉" required><button id="send" type="submit">送信</button></form><div id="info">送信された言葉は全員の画面に表示されます。最大36文字。</div></section><div id="setup"><article><h1>WORDS IN COMMON</h1><p>共有インスタレーションの初期設定</p><p>FirebaseのWebアプリ設定を貼り付けてください。Firestoreの設定とセキュリティルールは同梱のREADMEをご確認ください。設定はこのブラウザに保存されます。</p><textarea id="config" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'></textarea><button id="connect">接続する</button><small id="setupError"></small></article></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getFirestore,collection,doc,addDoc,onSnapshot,query,orderBy,limit,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const firebaseConfig = {
 apiKey: "AIzaSyACLWV4mkQXTbfS7sc0ZKZ_c8g3n1sbmkc",
 authDomain: "words-in-common.firebaseapp.com",
 projectId: "words-in-common",
 storageBucket: "words-in-common.firebasestorage.app",
 messagingSenderId: "58256731398",
 appId: "1:58256731398:web:1f850c739b5f78e6340287"
};
const projector=new URLSearchParams(location.search).get('view')==='projector';
if(!projector)document.body.classList.add('participant');
if(projector){document.body.classList.add('projector');document.getElementById('ui').remove();document.getElementById('title').style.display='none';document.getElementById('notice').style.display='none'}
const $=id=>document.getElementById(id), stage=$('stage');let db,auth,submitting=false;const items=new Map();const epoch=Date.now();
const defaults={speed:1,fontSize:1,maxWords:150,bgColor:'#101014',textColor:'#f1eee7',paused:false,hidden:false};
let display={...defaults},motionTime=0,lastFrame=0,latestDocs=[],settingsError='';
function setting(data,keys,fallback){for(const key of keys){if(data[key]!==undefined&&data[key]!==null)return data[key]}return fallback}
function applyDisplay(data){
 display={speed:Number(setting(data,['speed','floatSpeed'],1)),fontSize:Number(setting(data,['fontSize','size','sizeMultiplier'],1)),maxWords:Number(setting(data,['maxWords','maxDisplay','maxItems'],150)),bgColor:setting(data,['bgColor','backgroundColor','background'],defaults.bgColor),textColor:setting(data,['textColor','fontColor'],defaults.textColor),paused:Boolean(setting(data,['paused','isPaused'],false)),hidden:Boolean(setting(data,['hidden','hideAll','isHidden'],false))};
 display.speed=Number.isFinite(display.speed)?Math.max(0,Math.min(10,display.speed)):1;
 display.fontSize=Number.isFinite(display.fontSize)?Math.max(.2,Math.min(5,display.fontSize)):1;
 display.maxWords=Number.isFinite(display.maxWords)?Math.max(0,Math.min(500,Math.floor(display.maxWords))):150;
 if(projector)document.body.style.backgroundColor=display.bgColor;
 stage.style.visibility=display.hidden?'hidden':'visible';
 render(latestDocs);
}


function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rand(seed,n){let x=Math.sin(seed*0.0001+n*78.233)*43758.5453123;return x-Math.floor(x)}
function draw(){const t=motionTime;for(const [id,obj] of items){const {el,seed}=obj;const x=10+rand(seed,1)*80+Math.sin(t*.13+rand(seed,3)*6.28)*5;const y=12+rand(seed,2)*70+Math.cos(t*.11+rand(seed,4)*6.28)*5;const angle=Math.sin(t*.07+rand(seed,5)*6.28)*9;el.style.left=x+'%';el.style.top=y+'%';el.style.transform=`translate(-50%,-50%) rotate(${angle}deg)`;el.style.opacity=String(.55+Math.sin(t*.22+rand(seed,6)*6.28)*.18)}}
function animate(now){if(lastFrame&&!display.paused)motionTime+=Math.min((now-lastFrame)/1000,.1)*display.speed;lastFrame=now;draw();requestAnimationFrame(animate)}requestAnimationFrame(animate);
function render(docs){latestDocs=docs;const keep=new Set();for(const doc of docs.slice(0,display.maxWords)){const data=doc.data();if(typeof data.text!=='string'||data.hidden===true)continue;const id=doc.id;keep.add(id);if(!items.has(id)){const seed=(typeof data.seed==='number' ? data.seed : hash(id)),el=document.createElement('div');el.className='word';el.textContent=data.text;stage.append(el);items.set(id,{el,seed})}const obj=items.get(id);obj.el.style.fontSize=((18+rand(obj.seed,7)*34)*display.fontSize)+'px';obj.el.style.color=display.textColor;}for(const [id,obj] of items){if(!keep.has(id)){obj.el.remove();items.delete(id)}}if($('notice'))$('notice').textContent=`${items.size} WORDS`}
async function start(cfg){$('setupError').textContent='接続しています…';try{if(!cfg.apiKey||!cfg.projectId||!cfg.appId)throw Error('apiKey、projectId、appIdが必要です。');const app=initializeApp(cfg);db=getFirestore(app);auth=getAuth(app);await signInAnonymously(auth);localStorage.setItem('words-firebase-config',JSON.stringify(cfg));$('setup').hidden=true;$('setup').style.display='none';if($('ui'))$('ui').hidden=false;onSnapshot(doc(db,'settings','display'),snap=>{settingsError='';applyDisplay(snap.exists()?snap.data():{})},err=>{settingsError='演出設定の同期エラー: '+err.message;if($('status'))$('status').textContent=settingsError;console.error(settingsError)});onSnapshot(query(collection(db,'words'),orderBy('createdAt','desc'),limit(500)),snap=>{if($('status'))$('status').textContent=settingsError||'オンライン · 全員と同期中';render(snap.docs)},err=>{if($('status'))$('status').textContent='同期エラー: '+err.message});}catch(e){$('setupError').textContent='接続できません: '+e.message}}
$('connect').onclick=()=>{try{start(JSON.parse($('config').value))}catch(e){$('setupError').textContent='JSONの形式をご確認ください。'}};
function releaseWord(value){
 const layer=$('flightLayer'),word=document.createElement('div');word.className='flightWord';word.textContent=value;layer.append(word);
 word.addEventListener('animationend',()=>word.remove(),{once:true});
 const released=$('released');released.classList.remove('visible');void released.offsetWidth;released.classList.add('visible');
 setTimeout(()=>released.classList.remove('visible'),1050);
}
if(!projector)$('form').addEventListener('submit',async e=>{e.preventDefault();if(submitting||!db||!auth?.currentUser)return;const value=$('input').value.trim().replace(/\s+/g,' ');if(!value||value.length>36)return;submitting=true;$('send').disabled=true;try{await addDoc(collection(db,'words'),{text:value,createdAt:serverTimestamp(),uid:auth.currentUser.uid,seed:Math.floor(Math.random()*1000000000)});$('input').value='';$('input').blur();releaseWord(value);if($('status'))$('status').textContent='ONLINE · CONNECTED'}catch(err){if($('status'))$('status').textContent='送信できません: '+err.message}finally{submitting=false;$('send').disabled=false}});
start(firebaseConfig);
</script></body></html>
