<script type="module">
const firebaseConfig = {

const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),projector=params.get('view')==='projector',preview=params.get('preview')==='1';

function makeRow(id,data){const row=document.createElement('div');row.className='message';const a=document.createElement('span');a.className='avatar';a.textContent='A';a.setAttribute('aria-hidden','true');const b=document.createElement('div');b.className='message-body';const author=document.createElement('div');author.className='author';const text=document.createElement('div');text.className='message-text';b.append(author,text);row.append(a,b);const obj={row,a,author,text};updateRow(obj,id,data);return obj}

const keep=new Set(selected.map(d=>d.id));for(const [id,obj] of rows){if(!keep.has(id)){obj.row.remove();rows.delete(id)}}let added=false;let cursor=root.firstElementChild;for(const d of selected){let obj=rows.get(d.id);if(!obj){obj=makeRow(d.id,d.data());rows.set(d.id,obj);added=true}else updateRow(obj,d.id,d.data());if(obj.row!==cursor)root.insertBefore(obj.row,cursor);cursor=obj.row.nextElementSibling}
$('empty').hidden=selected.length>0;if(follow&&!(projector&&display.paused))bottom(animate&&added);}

function applyDisplay(d){display={speed:number(d.speed??d.floatSpeed,1,.1,10),fontSize:number(d.fontSize??d.size??d.sizeMultiplier,1,.2,5),maxWords:Math.floor(number(d.maxWords??d.maxDisplay??d.maxItems,150,0,500)),bgColor:d.bgColor??d.backgroundColor??d.background??defaults.bgColor,textColor:d.textColor??d.fontColor??defaults.textColor,paused:Boolean(d.paused??d.isPaused),hidden:Boolean(d.hidden??d.hideAll??d.isHidden)};if(projector){const bg=display.bgColor==='#101014'?defaults.bgColor:display.bgColor,fg=display.textColor==='#f1eee7'?defaults.textColor:display.textColor;if(/^#[0-9a-f]{6}$/i.test(bg))document.body.style.setProperty('--bg',bg);if(/^#[0-9a-f]{6}$/i.test(fg))document.body.style.setProperty('--fg',fg)}setFont();render(latestDocs,{animate:false});}

function enable(){ready=true;if(!projector){input.disabled=false;send.disabled=false}}
setFont();window.addEventListener('resize',()=>{const follow=projector||nearBottom();setFont();if(follow)bottom(false)});if(projector){input.tabIndex=-1;send.tabIndex=-1}
