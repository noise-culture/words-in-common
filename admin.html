<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORDS IN COMMON — CONTROL</title><style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#eae8e2;font:14px system-ui,-apple-system,sans-serif}header{padding:22px 28px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;letter-spacing:.12em;font-weight:500}h2{font-size:14px;font-weight:500;color:#aaa}main{max-width:1200px;margin:auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:#1b1b21;border:1px solid #34343a;border-radius:14px;padding:22px}.panel.wide{grid-column:1/-1}button,input,select{font:inherit}button{cursor:pointer;background:#eeeae2;color:#111;border:0;padding:10px 15px;border-radius:8px}button:disabled{opacity:.4;cursor:not-allowed}button.alt{background:#34343b;color:#fff}button.danger{background:#66343b;color:#fff}button.active{background:#577064;color:white}input[type=range]{width:100%;accent-color:#bcb8af}input[type=color]{width:50px;height:36px;background:transparent;border:0}label{display:block;margin:18px 0;color:#ccc}label>span{float:right;color:#fff}.inline{display:flex;align-items:center;justify-content:space-between;gap:12px}#posts{max-height:450px;overflow:auto}.post{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #333;padding:12px 0}.post .word{font-family:Georgia,'Yu Mincho',serif;font-size:18px;overflow-wrap:anywhere}.post small{color:#999}.actions{display:flex;gap:6px}#login{max-width:480px;margin:100px auto;text-align:center}#app{display:none}#error{color:#efaaa7;white-space:pre-wrap}a{color:#d4d1c9}.hint{color:#aaa;font-size:12px;line-height:1.7}.stat{font-size:32px;font-weight:300}@media(max-width:750px){main{display:block}.panel{margin-bottom:16px}header{padding:12px}main{padding:12px}}</style></head><body>
<div id="login" class="panel"><h1>WORDS IN COMMON / CONTROL</h1><p class="hint">管理者のGoogleアカウントでログインしてください。</p><button id="signIn">Googleでログイン</button><p id="error"></p><p class="hint">初回ログイン時にUIDを表示します。Firebaseルールへの登録が必要です。</p></div>
<div id="app"><header><h1>WORDS IN COMMON / CONTROL</h1><div><span id="who"></span> <button class="alt" id="signOut">ログアウト</button></div></header><main>
<section class="panel"><h2>LIVE STATUS</h2><div class="stat" id="count">—</div><p class="hint">最新の投稿（最大500件取得）</p><p id="connection">接続中</p><p><a href="./?view=projector" target="_blank" rel="noopener">プロジェクター画面を開く ↗</a></p><p><a href="./" target="_blank" rel="noopener">参加者画面を開く ↗</a></p></section>
<section class="panel"><h2>DISPLAY CONTROLS</h2><label>浮遊速度 <span id="speedValue"></span><input id="speed" type="range" min="0.1" max="3" step="0.1"></label><label>文字サイズ <span id="sizeValue"></span><input id="size" type="range" min="0.5" max="2" step="0.1"></label><label>最大表示数 <span id="maxWordsValue"></span><input id="maxWords" type="range" min="10" max="300" step="5"></label><div class="inline"><label>背景色 <input id="background" type="color"></label><label>文字色 <input id="textColor" type="color"></label></div><div class="inline"><button id="paused" class="alt">一時停止</button><button id="hidden" class="alt">全体を非表示</button></div><p class="hint">スライダー操作は離した時に保存され、接続中の画面に反映されます。</p></section>
<section class="panel wide"><div class="inline"><h2>POST MODERATION</h2><span id="postCount"></span></div><div id="posts"></div></section>
</main></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,query,orderBy,limit,updateDoc,deleteDoc,setDoc,getDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig = {
 apiKey: "AIzaSyACLWV4mkQXTbfS7sc0ZKZ_c8g3n1sbmkc",
 authDomain: "words-in-common.firebaseapp.com",
 projectId: "words-in-common",
 storageBucket: "words-in-common.firebasestorage.app",
 messagingSenderId: "58256731398",
 appId: "1:58256731398:web:1f850c739b5f78e6340287"
};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id);
let admin=false,postsUnsub=()=>{},settingsUnsub=()=>{},current={speed:1,size:1,maxWords:150,background:'#101014',textColor:'#f1eee7',paused:false,hidden:false};
const err=e=>{$('error').textContent=e?.message||String(e)};
$('signIn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){err(e)}};
$('signOut').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{postsUnsub();settingsUnsub();admin=false;$('app').style.display='none';$('login').style.display='block';if(!user){$('error').textContent='';return} $('error').textContent=`UID: ${user.uid}\n管理者登録が済んでいない場合は、このUIDをFirestoreルールの ADMIN_UID に設定してください。`;
try{await getDoc(doc(db,'adminAccess','verification'));settingsUnsub=onSnapshot(doc(db,'settings','display'),snap=>{admin=true;$('app').style.display='block';$('login').style.display='none';$('who').textContent=user.email||'Admin';current={...current,...(snap.data()||{})};paint()},e=>err('管理権限を確認できません: '+e.message));
postsUnsub=onSnapshot(query(collection(db,'words'),orderBy('createdAt','desc'),limit(500)),snap=>{const docs=snap.docs;$('count').textContent=docs.length;$('postCount').textContent=`${docs.length} 件`;const root=$('posts');root.replaceChildren();for(const d of docs){const data=d.data(),row=document.createElement('div');row.className='post';const info=document.createElement('div'),word=document.createElement('div'),small=document.createElement('small');word.className='word';word.textContent=data.text||'';small.textContent=d.id+(data.hidden?' · 非表示':'');info.append(word,small);const actions=document.createElement('div');actions.className='actions';const toggle=document.createElement('button');toggle.className='alt';toggle.textContent=data.hidden?'再表示':'非表示';toggle.onclick=()=>updateDoc(doc(db,'words',d.id),{hidden:!data.hidden}).catch(e=>alert(e.message));const del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=()=>{if(confirm('この投稿を完全に削除しますか？'))deleteDoc(doc(db,'words',d.id)).catch(e=>alert(e.message))};actions.append(toggle,del);row.append(info,actions);root.append(row)}$('connection').textContent='オンライン'},e=>{$('connection').textContent='投稿取得エラー: '+e.message});}catch(e){err(e)}});
function paint(){for(const k of ['speed','size','maxWords','background','textColor']){$(k).value=current[k];const label=$(k+'Value');if(label)label.textContent=current[k]}for(const k of ['paused','hidden']){$(k).className=current[k]?'active':'alt';$(k).textContent=k==='paused'?(current[k]?'再開':'一時停止'):(current[k]?'再表示':'全体を非表示')}}
async function save(patch){if(!admin)return;try{await setDoc(doc(db,'settings','display'),{...current,...patch})}catch(e){alert('設定保存エラー: '+e.message)}}
for(const k of ['speed','size','maxWords']){$(k).onchange=e=>save({[k]:Number(e.target.value)});$(k).oninput=e=>{$(k+'Value').textContent=e.target.value}}
for(const k of ['background','textColor'])$(k).onchange=e=>save({[k]:e.target.value});
for(const k of ['paused','hidden'])$(k).onclick=()=>save({[k]:!current[k]});
</script></body></html>
